name: Upload Python Wheels

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "The branch, tag or SHA to checkout."
        required: true
        default: "master"

jobs:
  linux-deploy:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
      - name: Build wheel
        env:
          PYTHON: /opt/python/cp314-cp314/bin/python
        run: |
          $PYTHON -m pip install --upgrade setuptools wheel build "cython>=3.0.11,<4" "numpy>=2.0"
          $PYTHON -m build --no-isolation
          auditwheel repair dist/*linux_x86_64.whl
      - name: Publish to pypi
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pipx install twine
          twine upload dist/*.tar.gz --skip-existing
          twine upload wheelhouse/*.whl --skip-existing
  linux-aarch64-deploy:
    runs-on: ubuntu-24.04-arm
    container: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
      - name: Build wheel
        env:
          PYTHON: /opt/python/cp314-cp314/bin/python
        run: |
          $PYTHON -m pip install --upgrade setuptools wheel build "cython>=3.0.11,<4" "numpy>=2.0"
          $PYTHON -m build --no-isolation
          auditwheel repair dist/*linux_aarch64.whl
      - name: Publish to pypi
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pipx install twine
          twine upload wheelhouse/*.whl --skip-existing
  other-deploy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools build wheel twine
          pip install "cython>=3.0.11,<4" "numpy>=2.0"
      - name: Build wheel
        run: |
          python -m build --no-isolation
      - name: Publish to pypi
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          twine upload dist/*.whl --skip-existing
